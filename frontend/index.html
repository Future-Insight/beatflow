  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet"

  <style>
    :root {
      --bg: #0b0b0f;
      --bg-1: #101018;
      --bg-2: #16161f;
      --bg-3: #1d1d28;
      --line: #262633;
      --line-2: #30303f;
      --fg: #eaeaf0;
      --fg-dim: #a4a4b3;
      --fg-muted: #6b6b7a;
      --accent: #ff3b4e;
      --accent-soft: rgba(255, 59, 78, 0.14);
      --accent-line: rgba(255, 59, 78, 0.45);
      --ok: #4ade80;
      --warn: #fbbf24;
      --shadow: 0 20px 60px -20px rgba(0, 0, 0, .6), 0 1px 0 rgba(255, 255, 255, .03) inset;
      --radius: 14px;
      --radius-sm: 8px;
      --font-sans: "Geist", "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft Yahei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    :root[data-theme="light"] {
      --bg: #f5f5f2;
      --bg-1: #ffffff;
      --bg-2: #fafaf7;
      --bg-3: #eeeeea;
      --line: #d9d9d2;
      --line-2: #c9c9c0;
      --fg: #17171d;
      --fg-dim: #4c4c58;
      --fg-muted: #8a8a94;
      --accent-soft: rgba(255, 59, 78, 0.10);
      --accent-line: rgba(255, 59, 78, 0.40);
      --shadow: 0 18px 48px -24px rgba(20, 20, 30, .18), 0 1px 0 rgba(255, 255, 255, 1) inset;
    }

    :root[data-theme="light"] body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(255, 59, 78, .06), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(96, 96, 255, .04), transparent 60%),
        var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(255, 59, 78, .08), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(96, 96, 255, .05), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 32px 80px;
    }

    /* ---------- Hero ---------- */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 8px 4px 28px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }

    .hero-body {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;
      flex-wrap: wrap;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .brand-toolbar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .brand-stats {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 4px 12px;
      height: 36px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: var(--font-mono);
    }

    .brand-stats .bs-item {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }

    .brand-stats .bs-v {
      color: var(--fg);
      font-weight: 600;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .brand-stats .bs-k {
      color: var(--fg-muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand-stats .bs-sep {
      width: 1px;
      height: 18px;
      background: var(--line);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #ff7a3c);
      position: relative;
      box-shadow: 0 6px 20px -4px var(--accent-soft);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: #0b0b0f;
      border-radius: 2px;
    }

    .brand-mark::before {
      left: 9px;
      top: 9px;
      width: 3px;
      height: 16px;
    }

    .brand-mark::after {
      left: 16px;
      top: 6px;
      width: 3px;
      height: 22px;
    }

    .brand-name {
      font-weight: 700;
      letter-spacing: -0.01em;
      font-size: 15px;
    }

    .brand-dot {
      color: var(--fg-muted);
    }

    .brand-sub {
      color: var(--fg-muted);
      font-size: 13px;
      font-family: var(--font-mono);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .hero h1 .grad {
      background: linear-gradient(90deg, var(--accent) 0%, #ff7a3c 50%, #ffd166 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-sub {
      margin-top: 14px;
      color: var(--fg-dim);
      font-size: 15px;
      max-width: 620px;
      line-height: 1.55;
    }

    .hero-sub code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--bg-2);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--line);
      color: var(--fg);
    }

    .hero-sub-meta {
      display: block;
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--fg-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
    }

    .hero-main {
      flex: 1;
      min-width: 0;
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      flex-shrink: 0;
    }

    /* Brand-row toolbar buttons */
    .brand-toolbar .tb-btn {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      color: var(--fg-dim);
      border: none;
      cursor: pointer;
      min-width: 32px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 9px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 7px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .brand-toolbar .tb-btn:hover {
      background: var(--bg-3);
      color: var(--fg);
    }

    .brand-toolbar .tb-btn.tb-icon {
      padding: 0;
      width: 30px;
    }

    .brand-toolbar .tb-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Privacy line below hero subtitle */
    .hero-privacy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 14px 6px 8px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12.5px;
      color: var(--fg-dim);
      line-height: 1.2;
    }

    .hero-privacy .hp-ico {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg-3);
      color: var(--fg-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hero-privacy .hp-ico svg {
      width: 11px;
      height: 11px;
    }

    .stat-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 18px;
      min-width: 120px;
      position: relative;
      overflow: hidden;
    }

    .chip .chip-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip .chip-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .chip .chip-value {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .chip .chip-unit {
      color: var(--fg-muted);
      font-size: 12px;
      margin-left: 4px;
      font-weight: 400;
    }

    .chip.live::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .35;
      animation: chipShine 2.4s ease-in-out infinite;
    }

    @keyframes chipShine {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    /* ---------- Grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: minmax(360px, 420px) 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
    }

    .grid .panel.wide {
      grid-column: 1 / -1;
    }

    .panel {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .panel-title .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
    }

    .panel-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-muted);
      letter-spacing: 0.04em;
    }

    /* ---------- Forms ---------- */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      min-width: 0;
    }

    .field .select,
    .field .input {
      min-width: 0;
      width: 100%;
    }

    .field label {
      font-size: 12px;
      color: var(--fg-dim);
      letter-spacing: 0.01em;
    }

    .field label .hint {
      color: var(--fg-muted);
      margin-left: 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .field-action {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--fg-dim);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }

    .field-action:hover {
      color: var(--accent);
      border-color: var(--accent-line);
      background: var(--bg-3);
    }

    .input,
    .select {
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--fg);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 13px;
      transition: border-color .15s, background .15s;
    }

    .input:focus,
    .select:focus {
      outline: none;
      border-color: var(--accent-line);
      background: var(--bg-3);
    }

    .input.mono {
      font-family: var(--font-mono);
    }

    .select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--fg-dim) 50%), linear-gradient(135deg, var(--fg-dim) 50%, transparent 50%);
      background-position: calc(100% - 16px) 50%, calc(100% - 12px) 50%;
      background-size: 4px 4px;
      background-repeat: no-repeat;
      padding-right: 30px;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .upload {
      border: 1.5px dashed var(--line-2);
      border-radius: var(--radius-sm);
      padding: 18px 16px;
      background: var(--bg-2);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .upload:hover {
      border-color: var(--accent-line);
      background: var(--bg-3);
    }

    .upload.has-file {
      border-style: solid;
      border-color: var(--accent-line);
      background: var(--bg-3);
    }

    .upload.drag-over {
      border-color: var(--accent);
      background: var(--bg-3);
      box-shadow: 0 0 0 3px rgba(255, 59, 78, .12) inset;
    }

    .upload.drag-over * {
      pointer-events: none;
    }

    .upload {
      position: relative;
    }

    .upload-clear {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .35);
      border: 1px solid var(--line);
      color: var(--fg-dim);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s, border-color .15s;
    }

    .upload-clear:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .upload-ico {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg-dim);
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 18px;
    }

    .upload-ico svg {
      width: 18px;
      height: 18px;
    }

    .upload-text .t1 {
      font-size: 13px;
      font-weight: 500;
    }

    .upload-text .t2 {
      font-size: 11.5px;
      color: var(--fg-muted);
      font-family: var(--font-mono);
      margin-top: 3px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row>* {
      flex: 1;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-3);
      border-color: var(--line-2);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 6px 18px -6px var(--accent);
    }

    .btn-primary:hover {
      background: #ff5264;
      border-color: #ff5264;
    }

    .btn-ghost {
      background: transparent;
    }

    .btn-icon {
      width: 36px;
      padding: 0;
      flex: 0 0 36px;
    }

    .btn .kbd {
      font-family: var(--font-mono);
      font-size: 10.5px;
      background: rgba(0, 0, 0, .25);
      padding: 2px 6px;
      border-radius: 4px;
      color: rgba(255, 255, 255, .7);
    }

    /* ---------- Waveform ---------- */
    .wave {
      margin-top: 16px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 12px 10px;
      position: relative;
    }

    .wave-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .wave-head .t {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .wave-canvas {
      position: relative;
      height: 72px;
    }

    .wave-canvas svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .wave-bar {
      fill: var(--fg-muted);
      opacity: .55;
    }

    .wave-bar.in-range {
      fill: var(--fg-dim);
      opacity: .8;
    }

    .wave-beat {
      stroke: var(--accent);
      stroke-width: 1.4;
      opacity: .85;
    }

    .wave-playhead {
      stroke: #fff;
      stroke-width: 1.6;
    }

    .wave-foot {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* ---------- Preview stage ---------- */
    .preview-wrap {
      display: grid;
      grid-template-columns: minmax(220px, 300px) 1fr;
      gap: 24px;
      align-items: start;
    }

    .preview-wrap.stacked {
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }

    .stage-holder {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage {
      --w: 270px;
      width: var(--w);
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 0;
      border: 1px solid var(--line-2);
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .8), 0 0 0 4px #000;
    }

    .stage.a1-1 {
      aspect-ratio: 1 / 1;
      --w: 300px;
    }

    .stage.a16-9 {
      aspect-ratio: 16 / 9;
      --w: 380px;
    }

    .stage .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .stage .slide.on {
      opacity: 1;
    }

    .stage .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stage .slide-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 13px;
      color: rgba(255, 255, 255, .85);
      letter-spacing: 0.06em;
      position: relative;
    }

    .stage .pulse {
      display: none;
    }

    .stage-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .stage-hud .tag {
      font-family: var(--font-mono);
      font-size: 10px;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }

    .stage-hud .rec {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .stage-hud .rec .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: recPulse 1.1s infinite;
    }

    @keyframes recPulse {

      0%,
      100% {
        opacity: .4;
      }

      50% {
        opacity: 1;
      }
    }

    .stage-meta {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-muted);
    }

    .stage-meta b {
      color: var(--fg);
      font-weight: 500;
    }

    /* Timeline */
    .timeline {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 16px 12px;
    }

    .tl-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tl-time {
      font-family: var(--font-mono);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .tl-time .sep {
      color: var(--fg-muted);
      margin: 0 6px;
    }

    .tl-ctrls {
      display: flex;
      gap: 6px;
    }

    .tl-ctrls .btn {
      padding: 7px 11px;
      font-size: 12px;
    }

    .tl-track-wrap {
      position: relative;
      height: 54px;
      padding: 8px 0;
      cursor: pointer;
      user-select: none;
    }

    .tl-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      background: var(--line-2);
      border-radius: 2px;
      transform: translateY(-50%);
    }

    .tl-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, var(--accent), #ff7a3c);
      border-radius: 2px;
      pointer-events: none;
    }

    .tl-beats {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      bottom: 10px;
      pointer-events: none;
    }

    .tl-beat {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--fg-muted);
      opacity: .35;
    }

    .tl-beat.downbeat {
      background: var(--accent);
      opacity: .7;
      width: 2px;
    }

    .tl-beat.passed {
      background: var(--accent);
      opacity: .9;
    }

    .tl-dim {
      position: absolute;
      top: 8px;
      bottom: 8px;
      background: rgba(11, 11, 15, 0.7);
      pointer-events: none;
      z-index: 1;
    }

    .tl-range-mark {
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--accent);
      transform: translateX(-1px);
      pointer-events: none;
      z-index: 2;
    }

    .tl-range-mark::before {
      content: "";
      position: absolute;
      top: -4px;
      left: -3px;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 2px;
    }

    .tl-range-mark.end::before {
      top: auto;
      bottom: -4px;
    }

    .tl-playhead {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 3px var(--accent), 0 4px 10px rgba(0, 0, 0, .5);
      pointer-events: none;
      z-index: 3;
    }

    .tl-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-muted);
      margin-top: 4px;
      letter-spacing: 0.06em;
    }

    .tl-range {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    .tl-range-field label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--fg-dim);
      margin-bottom: 4px;
    }

    .tl-range-field label .v {
      font-family: var(--font-mono);
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .tl-range-reset {
      padding: 8px;
      width: 34px;
      height: 34px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--fg-muted);
    }

    .tl-range-reset:hover {
      color: var(--accent);
    }

    /* Export summary block */
    .export-summary {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .export-summary .es-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
    }

    .export-summary .es-label {
      font-size: 12px;
      color: var(--fg-dim);
    }

    .export-summary .es-label .hint {
      color: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      margin-left: 4px;
    }

    .export-summary .es-dur {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .export-summary .es-dur span {
      font-size: 12px;
      color: var(--fg-muted);
      font-weight: 400;
      margin-left: 3px;
    }

    .export-summary .es-bar {
      position: relative;
      height: 4px;
      background: var(--line-2);
      border-radius: 2px;
      overflow: hidden;
    }

    .export-summary .es-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, var(--accent), #ff7a3c);
      border-radius: 2px;
    }

    .export-summary .es-times {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-muted);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }

    .export-summary .es-times span:nth-child(2) {
      color: var(--accent);
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-dim);
      letter-spacing: 0.04em;
    }

    .pill.accent {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--accent-line);
    }

    .pill .k {
      color: var(--fg-muted);
      margin-right: 6px;
    }

    /* ---------- Thumbnails ---------- */
    .thumbs-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .thumbs-head .count {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--fg-muted);
    }

    .thumbs-head .count b {
      color: var(--fg);
      font-weight: 500;
    }

    .thumbs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 10px;
      max-height: 440px;
      overflow-y: auto;
      padding: 2px 8px 2px 2px;
      margin-right: -6px;
    }

    .thumbs-grid::-webkit-scrollbar {
      width: 6px;
    }

    .thumbs-grid::-webkit-scrollbar-thumb {
      background: var(--line-2);
      border-radius: 6px;
      border: 0;
    }

    .thumb {
      position: relative;
      aspect-ratio: 9/16;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--line);
      cursor: grab;
      transition: transform .15s, border-color .15s, box-shadow .15s;
      background: var(--bg-3);
    }

    .thumb:hover {
      border-color: var(--line-2);
      transform: translateY(-1px);
    }

    .thumb.active {
      border-color: #eaeaf0;
      box-shadow: 0 0 0 3px rgba(234, 234, 240, .15);
    }

    .thumb.dragging {
      opacity: .4;
    }

    .thumb.drop-left {
      box-shadow: -3px 0 0 0 var(--accent);
    }

    .thumb.drop-right {
      box-shadow: 3px 0 0 0 var(--accent);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb .ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      color: rgba(255, 255, 255, .85);
      font-size: 11px;
    }

    .thumb .idx {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .thumb .del {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
      font-size: 14px;
      line-height: 1;
    }

    .thumb:hover .del {
      opacity: 1;
    }

    .thumb .drag-grip {
      position: absolute;
      bottom: 6px;
      left: 6px;
      color: rgba(255, 255, 255, .7);
      font-family: var(--font-mono);
      font-size: 10px;
      background: rgba(0, 0, 0, .5);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .thumb-add {
      aspect-ratio: 9/16;
      border-radius: 10px;
      border: 1.5px dashed var(--line-2);
      background: var(--bg-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--fg-muted);
      cursor: pointer;
      transition: all .15s;
    }

    .thumb-add:hover {
      border-color: var(--accent-line);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .thumb-add .plus {
      font-size: 20px;
      font-family: var(--font-mono);
    }

    .thumb-add .t {
      font-size: 10.5px;
      font-family: var(--font-mono);
    }

    /* ---------- Export ---------- */
    .export-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .slider-field label {
      display: flex;
      justify-content: space-between;
    }

    .slider-field label .v {
      font-family: var(--font-mono);
      color: var(--fg);
    }

    .range-slider {
      position: relative;
      height: 36px;
      margin-top: 4px;
    }

    .range-slider .range-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: var(--line-2);
      border-radius: 2px;
    }

    .range-slider .range-fill {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #ff7a3c);
      border-radius: 2px;
    }

    .range-slider input[type=range] {
      position: absolute;
      inset: 0;
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
      margin: 0;
    }

    .range-slider input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
      pointer-events: auto;
      cursor: pointer;
    }

    .range-slider input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      pointer-events: auto;
      cursor: pointer;
    }

    .export-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .export-cta {
      padding: 14px 20px;
      font-size: 14px;
    }

    .export-note {
      color: var(--warn);
      font-size: 12px;
      font-family: var(--font-mono);
      line-height: 1.5;
    }

    .export-note::before {
      content: "⚠ ";
    }

    .export-progress {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .export-progress .lbl {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg);
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .export-progress .track {
      height: 6px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .export-progress .bar {
      position: absolute;
      inset: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #ff7a3c);
      transition: width .2s;
    }

    /* ---------- Tweaks ---------- */
    .tweaks {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 280px;
      background: var(--bg-1);
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7);
      padding: 16px;
      z-index: 80;
      display: none;
    }

    .tweaks.on {
      display: block;
    }

    .tweaks-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .tweaks-head .t {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tweaks-head .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .tweaks-head .close {
      cursor: pointer;
      color: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .tweaks-row {
      margin-bottom: 12px;
    }

    .tweaks-row label {
      font-size: 11px;
      color: var(--fg-dim);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 6px;
    }

    .swatches {
      display: flex;
      gap: 8px;
    }

    .sw {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid var(--line);
      cursor: pointer;
    }

    .sw.active {
      border-color: #fff;
    }

    .seg {
      display: flex;
      gap: 4px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      padding: 3px;
      border-radius: 8px;
    }

    .seg button {
      flex: 1;
      background: transparent;
      border: 0;
      color: var(--fg-dim);
      padding: 6px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .seg button.on {
      background: var(--bg-3);
      color: var(--fg);
    }

    .aspect-seg {
      padding: 2px;
    }

    .aspect-seg button {
      padding: 4px 8px;
      font-size: 10.5px;
      letter-spacing: 0.04em;
    }

    .fit-seg {
      padding: 2px;
    }

    .fit-seg button {
      padding: 5px 10px;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    /* Preset tracks */
    .preset-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preset-chip {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      text-align: left;
      transition: all .15s;
      color: var(--fg);
      font-family: var(--font-sans);
    }

    .preset-chip:hover {
      background: var(--bg-3);
      border-color: var(--line-2);
    }

    .preset-chip.on {
      border-color: var(--accent-line);
      background: var(--bg-3);
    }

    .preset-chip .pc-genre {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--fg-muted);
      margin-bottom: 3px;
    }

    .preset-chip.on .pc-genre {
      color: var(--fg);
    }

    .preset-chip .pc-name {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
    }

    .preset-chip .pc-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Preset image sets */
    .preset-sets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .preset-set {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      transition: all .15s;
      font-family: var(--font-sans);
      color: var(--fg);
      text-align: left;
    }

    .preset-set:hover {
      background: var(--bg-3);
      border-color: var(--accent-line);
    }

    .preset-set .ps-strip {
      display: flex;
      gap: 2px;
      height: 22px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 7px;
    }

    .preset-set .ps-strip>div,
    .preset-set .ps-strip>img {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preset-set .ps-name {
      font-size: 11.5px;
      font-weight: 500;
    }

    .preset-set .ps-tag {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--fg-muted);
      margin-top: 2px;
    }

    .tweaks input[type=range] {
      width: 100%;
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line-2);
      border-radius: 10px;
      border: 2px solid var(--bg);
    }

    /* hidden inputs */
    input[type=file] {
      display: none;
    }

    @media (max-width: 1080px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .preview-wrap {
        grid-template-columns: 1fr;
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* ── Site footer ──────────────────────────────────────────── */
    .site-footer {
      margin-top: 56px;
      padding: 22px 4px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      color: var(--fg-muted);
      font-size: 12.5px;
    }

    .ft-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .ft-left .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
    }

    .ft-left .brand-mark::before {
      left: 6px;
      top: 6px;
      width: 2px;
      height: 10px;
    }

    .ft-left .brand-mark::after {
      left: 10px;
      top: 4px;
      width: 2px;
      height: 14px;
    }

    .ft-name {
      font-weight: 600;
      color: var(--fg-dim);
      font-size: 13px;
    }

    .ft-dim {
      color: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    .ft-links {
      display: inline-flex;
      gap: 18px;
    }

    .ft-link {
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 12.5px;
      transition: color .15s;
    }

    .ft-link:hover {
      color: var(--accent);
    }
  </style>
</head>
